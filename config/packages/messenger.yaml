framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: 'doctrine://default?auto_setup=true'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Message\StitchVideoChunks: async
            App\Message\CleanupVideoChunks: async
            App\Message\DeleteTaskWithVideo: async

